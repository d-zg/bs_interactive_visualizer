[package]
name = "bs_interactive_plot"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
yew = { version = "0.20", features = ["csr"] }
wasm-bindgen = "0.2"
plotters = "0.3"
plotters-canvas = "0.3"
statrs = "0.15"
getrandom = { version = "0.2", features = ["js"] }
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "console"] }
